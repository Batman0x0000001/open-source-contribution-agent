[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-contribution-agent"
version = "0.1.0"
description = "A local CLI harness for open source contribution agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.25.0",
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.2.0,<3",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "portalocker>=2.8.0,<4",
]

[project.optional-dependencies]
bot = [
  "fastapi>=0.115.0,<1",
  "uvicorn>=0.34.0,<1",
  "httpx>=0.28.0,<1",
  "PyJWT[crypto]>=2.10.0,<3",
]

[project.scripts]
osc-agent = "osc_agent.cli:app"

[tool.setuptools.packages.find]
include = ["osc_agent*"]

[tool.setuptools.package-data]
osc_agent = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest-cache-temp"
markers = [
  "live_model: manually enabled tests that call the configured Anthropic-compatible API",
]
